project_name: "Wiki_Benchmark"
dataset_name: "paperscope_summary_93_gap"

adapter:
  module: "src.adapters.paperscope_summary_adapter"
  class_name: "PaperScopeSummaryAdapter"

execution:
  mode: "vikingbot"
  server_port: 2026
  max_workers: 5
  retrieval_topk: 5
  # Match ScholarQA-Multi: restrict QA search/read/list to synthesized Wiki nodes.
  vikingbot_openviking_root_uri: "viking://wiki/nodes"
  max_queries: null
  skip_ingestion: false
  ingest_mode: "directory"
  build_wiki: true
  wiki_card_input_mode: "summary"
  wiki_max_card_input_chars: 20000
  wiki_max_source_input_chars: 20000
  retrieval_instruction: ""

paths:
  dataset_path: "datasets/PaperScopeSummary93/summary_gap.jsonl"
  doc_output_dir: "wiki_storage/paperscope_summary_93/paperscope_summary_93_processed_docs"
  resource_manifest: "wiki_storage/paperscope_summary_93/imported_resources.json"
  vector_store: "wiki_storage/paperscope_summary_93/paperscope_summary_93_viking_store_index"
  output_dir: "Output/{dataset_name}/wiki"
  log_file: "Output/{dataset_name}/wiki/benchmark.log"

llm:
  model: "${OV_VLM_MODEL}"
  provider: "${OV_VLM_PROVIDER}"
  temperature: 0
  base_url: "${OV_VLM_API_BASE}"
  api_key_env_var: "OV_VLM_API_KEY"
