metadata:
  id: "wiki.node_card"
  name: "Wiki Node Card"
  description: "Generate one Wiki Card from a generated Wiki node"
  version: "1.4.0"
  language: "en"
  category: "wiki"

variables:
  - name: "input_json"
    type: "string"
    description: "JSON encoded Wiki node and generated node documents"
    required: true

template: |
  Generate one Wiki Card for the given generated Wiki node.

  The input contains:
  - node.title and node.scope. Treat scope as the authoritative boundary.
  - generated documents. Use only document content as the factual source for the card.

  Write a concise, evidence-grounded refinement of node.scope: describe the specific knowledge actually
  present, including discriminative objects, methods, relationships, conditions, or boundaries where useful.
  Do not merely restate the title or scope, broaden the scope, enumerate every detail, or invent facts.

  Input:
  {{ input_json }}

  Return only a JSON object with the field summary, conforming to the provided JSON Schema.

llm_config:
  temperature: 0.0
