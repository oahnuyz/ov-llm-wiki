metadata:
  id: "wiki.node_aggregation_agent"
  name: "Wiki Batch Aggregation Agent"
  description: "Incrementally build one Wiki layer from batches of cards"
  version: "2.1.0"
  language: "en"
  category: "wiki"

variables:
  - name: "input_json"
    type: "string"
    description: "JSON encoded current aggregation state"
    required: true
  - name: "has_more_batches"
    type: "boolean"
    description: "Whether more new cards will arrive after this batch"
    required: true

template: |
  You are processing one batch of cards to build a layer of a scientific Wiki.

  Context:
  - existing_nodes lists this layer's directories and their member cards. Member summaries are hidden;
    use read_summary when needed. read_summaries contains summaries already read.
  - unassigned_cards lists cards awaiting assignment, including their summaries.
  - Document cards provide candidate_topics; lower-layer directory cards provide scope.
    Use these to identify possible groupings and summaries to verify coherence. A directory card's
    scope is its authoritative boundary; do not attribute knowledge beyond it to that card.

  Coherence test for every directory:
  - Require at least two distinct cards. Leave cards unassigned when no coherent grouping exists.
  - Members must share both a compatible scientific object/system and a coherent research axis such as
    problem, mechanism, method family, outcome, or evidence relationship.
  - Shared vocabulary, application area, material, or modality alone is insufficient. For example, do not
    join drug delivery with biopharmaceutical manufacturing merely because both are biomedical, or join
    biosensing with unrelated optical enhancement merely because both use photonic terminology.
  - The node must have one precise scope with a clear inclusion boundary. If that requires unrelated clauses
    or a catch-all phrase, keep the cards separate. Never merge merely to reduce node or unassigned counts.

  Tools and editing:
  - Tool calls execute in order. Use supplied card IDs and existing node IDs for edits.
    New node IDs must be unique and use lowercase letters, digits, and underscores.
  - A directed acyclic graph (DAG) is allowed when useful: a child node may belong to multiple parent
    directories if its card substantively supports their distinct, non-duplicate scopes and each
    membership satisfies the Coherence test.
  - If an existing directory fails the Coherence test, revise its membership, title, or scope,
    or split or merge it as needed to form coherent directories.
  - Fix tool_errors before repeating a call.

  Completion:
  {% if has_more_batches %}
  - More new cards will arrive later. Leave unclear cards for the next batch instead of forcing a grouping.
    When no useful edit remains, call finish alone to end this batch.
  {% else %}
  - All cards for this layer have arrived. There are no later batches. A card may remain unassigned if
    it cannot be placed in an existing or new directory while satisfying the Coherence test.
    When no useful edit remains, call finish alone to end this layer, regardless of whether
    unassigned_cards is empty.
  {% endif %}

  Current state:
  {{ input_json }}

  Return function calls only.

llm_config:
  temperature: 0.0
