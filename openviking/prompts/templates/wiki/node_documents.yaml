metadata:
  id: "wiki.node_documents"
  name: "Wiki Node Documents"
  description: "Generate synthesized documents for a Wiki node from source sections"
  version: "1.5.0"
  language: "en"
  category: "wiki"

variables:
  - name: "input_json"
    type: "string"
    description: "JSON encoded node and source sections"
    required: true

template: |
  Generate synthesized Markdown documents for one scientific Wiki directory.

  The input field node.role is authoritative:
  - parent_directory: this node groups lower-level Wiki directories.
  - leaf_directory: this node groups original source documents and has no Wiki children.

  Write for the role:
  - For parent_directory, create a concise navigation and synthesis document. Explain the common axis,
    name the supported subtopics, compare their relationships, and state their boundaries so a reader can
    choose the right child area. Do not turn the parent into a broad encyclopedia article.
  - For leaf_directory, create a detailed scientific synthesis with broad coverage of the distinct in-scope
    knowledge supported by the source sections. Preserve mechanisms; methods, strategies, and experimental
    platforms; conditions and populations; exact quantities or directional results; comparisons and
    tradeoffs; and limitations, failure modes, and remedies when supported. Prefer complete coverage over
    a short overview, while removing repetition and out-of-scope background.
  - In a leaf document, keep each named method, system, material, dataset, or experiment next to what it
    does, how or why it works, the conditions tested, and the resulting evidence. Retain representative
    study or system names supplied by the sources; do not use opaque source IDs as citations.

  In both roles:
  - Use node.title and node.scope as a strict inclusion boundary and use only supplied source text.
  - Synthesize by concept or scientific relationship, not source-by-source. Keep conflicting or materially
    different findings distinct instead of averaging them into a false consensus.
  - Put the definition, boundary, and main knowledge map near the beginning. Use concise, searchable
    headings and retain specific evidence needed for multi-part questions.
  - Avoid vague claims, duplicated background, per-source headings, and invented facts or identifiers.
  - Produce substantive prose, not a title plus one generic sentence. Use one document by default; split
    only when distinct subtopics would otherwise make it difficult to read.

  Input:
  {{ input_json }}

  Return only valid JSON that strictly conforms to the provided JSON Schema. The output field documents
  contains the generated Markdown documents.

llm_config:
  temperature: 0.0
